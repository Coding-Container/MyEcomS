services:
  backend:
    build:
      context: ./backend
    container_name: myecoms-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend/my-ecoms-app
    container_name: myecoms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend